<!DOCTYPE html>
<html lang="zh-CN" class="i18n-pending">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZeroTrace Engine - 清理计划</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>

<body>
  <main class="cleanup-page">
    <header class="page-header">
      <div>
        <p class="eyebrow">ZeroTrace Engine</p>
        <h1>清理计划</h1>
        <p class="page-desc">确认本次清理目标。执行后文件会先移动至 ZeroTraceRecycle。</p>
      </div>

      <div class="header-actions">
        <button id="backButton" class="ghost-button nav-button" type="button"><span class="button-icon">↩</span><span>返回首页</span></button>
        <button id="backScanButton" class="ghost-button nav-button" type="button"><span class="button-icon">↩</span><span>返回扫描页</span></button>
        <button id="reloadPlanButton" class="ghost-button" type="button"><span class="button-icon">↻</span><span>重置计划</span></button>
        <button id="executePlanButton" class="primary-button" type="button" disabled><span class="button-icon">🛡</span><span>执行清理</span></button>
      </div>
    </header>

    <section class="summary-grid">
      <article class="summary-card">
        <span class="summary-label">计划项目</span>
        <strong id="planItemCount">0</strong>
      </article>
      <article class="summary-card">
        <span class="summary-label">预计释放</span>
        <strong id="planTotalSize">0 B</strong>
      </article>
      <article class="summary-card">
        <span class="summary-label">高风险</span>
        <strong id="planHighRiskCount">0</strong>
      </article>
      <article class="summary-card">
        <span class="summary-label">涉及目录</span>
        <strong id="planDirCount">0</strong>
      </article>
      <article class="summary-card">
        <span class="summary-label">状态</span>
        <strong id="planStatus">待确认</strong>
      </article>
    </section>

    <section class="toolbar-panel cleanup-toolbar">
      <div class="toolbar-left">
        <label>
          分类
          <select id="planCategoryFilter">
            <option value="">全部</option>
            <option value="temp">临时文件</option>
            <option value="cache">缓存</option>
            <option value="log">日志</option>
            <option value="duplicate">重复文件</option>
            <option value="empty">空文件</option>
          </select>
        </label>

        <label>
          风险等级
          <select id="planRiskFilter">
            <option value="">全部</option>
            <option value="low">低风险</option>
            <option value="medium">中风险</option>
            <option value="high">高风险</option>
          </select>
        </label>

        <label>
          操作
          <select id="planActionFilter">
            <option value="">全部</option>
            <option value="recycle">移入回收区</option>
            <option value="ignore">忽略</option>
          </select>
        </label>
      </div>

      <div class="toolbar-right">
        <button id="selectAllPlanButton" class="ghost-button" type="button" disabled>全选</button>
        <button id="invertPlanButton" class="ghost-button" type="button" disabled>反选</button>
        <button id="selectHighRiskButton" class="ghost-button" type="button" disabled>仅高风险</button>
      </div>
    </section>

    <section class="content-grid plan-content-grid">
      <article class="panel-card">
        <p class="eyebrow">Strategy</p>
        <h2>执行策略</h2>

        <div class="check-list">
          <label><input id="keepRecentFiles" type="checkbox" checked /> 保留最近修改文件</label>
          <label><input id="skipSystemDirs" type="checkbox" checked /> 跳过系统目录</label>
          <label><input id="skipTinyFiles" type="checkbox" checked /> 跳过小于 1 KB 的文件</label>
          <label><input id="preferDuplicates" type="checkbox" checked /> 优先处理重复文件</label>
        </div>
      </article>

      <article class="panel-card">
        <p class="eyebrow">Confirm</p>
        <h2>执行确认</h2>
        <p class="muted">本次操作不会永久删除文件。所有选中项目会先移动至 ZeroTraceRecycle，并记录到审计日志。</p>

        <label class="confirm-check">
          <input id="confirmExecuteCheck" type="checkbox" />
          我已确认本次清理计划
        </label>

        <p id="planHint" class="hint-text">请确认计划内容后，再执行清理。</p>
      </article>
    </section>

    <section class="table-panel">
      <div class="table-header">
        <h2>计划项目</h2>
        <p id="planTableHint">请确认路径、大小、来源与风险后执行。</p>
      </div>

      <div class="scan-table-wrap">
        <table class="scan-table">
          <colgroup>
            <col class="col-check" />
            <col class="col-path" />
            <col class="col-size" />
            <col class="col-category" />
            <col class="col-source" />
            <col class="col-risk" />
            <col class="col-action" />
          </colgroup>
          <thead>
            <tr>
              <th class="col-check">选择</th>
              <th>路径</th>
              <th>大小</th>
              <th>分类</th>
              <th>来源</th>
              <th>风险</th>
              <th>操作</th>
            </tr>
          </thead>

          <tbody id="planTableBody">
            <tr>
              <td colspan="7" class="empty-cell">暂无清理计划</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="dialogOverlay" class="dialog-overlay is-hidden" role="presentation">
    <div class="dialog-box" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <h2 id="dialogTitle">ZeroTraceEngine</h2>
      <div id="dialogMessage" class="dialog-message"></div>
      <div class="dialog-actions">
        <button id="dialogCancelButton" type="button" class="ghost" data-i18n="dialog.buttons.cancel">Cancel</button>
        <button id="dialogConfirmButton" type="button" class="primary-button" data-i18n="dialog.buttons.ok">OK</button>
      </div>
    </div>
  </div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
