<!DOCTYPE html>
<html lang="zh-CN" class="i18n-pending">
<head>
  <meta charset="UTF-8" />
  <title>ZeroTrace Engine - Scan</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <main class="scan-page">
    <header class="page-header">
      <div>
        <p class="eyebrow">ZeroTrace Engine</p>
        <h1>系统扫描</h1>
        <p class="page-desc">扫描本地可整理项目。所有结果仅展示，不会自动清理。</p>
      </div>

      <div class="header-actions">
        <button id="backButton" class="ghost-button nav-button"><span class="button-icon">↩</span><span>返回首页</span></button>
        <button id="clearResultsButton" class="ghost-button danger-outline" disabled><span class="button-icon">×</span><span>清空结果</span></button>
        <button id="startScanButton" class="primary-button"><span class="button-icon">🔍</span><span>开始扫描</span></button>
      </div>
    </header>

    <section class="summary-grid">
      <article class="summary-card">
        <span class="summary-label">扫描项目</span>
        <strong id="scanItemCount">0</strong>
      </article>
      <article class="summary-card">
        <span class="summary-label">可整理空间</span>
        <strong id="scanTotalSize">0 B</strong>
      </article>
      <article class="summary-card">
        <span class="summary-label">已选择</span>
        <strong id="selectedCount">0</strong>
      </article>
      <article class="summary-card">
        <span class="summary-label">状态</span>
        <strong id="scanStatus">待扫描</strong>
      </article>
      <article class="summary-card">
        <span class="summary-label">扫描耗时</span>
        <strong id="scanDuration">-</strong>
      </article>
    </section>

    <section class="toolbar-panel">
      <div class="toolbar-left">
        <label>
          分类
          <select id="categoryFilter">
            <option value="">全部</option>
            <option value="temp">临时文件</option>
            <option value="empty">空文件/文件夹</option>
            <option value="browser_cache">浏览器缓存</option>
            <option value="log">日志文件</option>
            <option value="thumbnail">缩略图缓存</option>
          </select>
        </label>

        <label>
          风险等级
          <select id="riskFilter">
            <option value="">全部</option>
            <option value="low">低</option>
            <option value="medium">中</option>
            <option value="high">高</option>
          </select>
        </label>

        <label>
          来源
          <select id="sourceFilter">
            <option value="">全部</option>
          </select>
        </label>
      </div>

      <div class="toolbar-right">
        <button id="selectAllButton" class="ghost-button" disabled>全选</button>
        <button id="invertSelectionButton" class="ghost-button" disabled>反选</button>
        <button id="createPlanButton" class="primary-button" disabled>生成清理计划</button>
      </div>
    </section>

    <section class="table-panel">
      <div class="table-header">
        <h2>扫描结果</h2>
        <p>请确认路径、大小与来源后，再生成清理计划。</p>
      </div>

      <div class="scan-table-wrap">
        <table class="scan-table">
          <colgroup>
            <col class="col-check" />
            <col class="col-path" />
            <col class="col-size" />
            <col class="col-category" />
            <col class="col-source" />
            <col class="col-time" />
            <col class="col-risk" />
          </colgroup>
          <thead>
            <tr>
              <th class="col-check"></th>
              <th>路径</th>
              <th>大小</th>
              <th>分类</th>
              <th>来源</th>
              <th>修改时间</th>
              <th>风险</th>
            </tr>
          </thead>
          <tbody id="scanResultBody">
            <tr class="empty-row">
              <td colspan="7">暂无扫描结果</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="dialogOverlay" class="dialog-overlay is-hidden" role="presentation">
    <div class="dialog-box" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <h2 id="dialogTitle">ZeroTraceEngine</h2>
      <div id="dialogMessage" class="dialog-message"></div>
      <div class="dialog-actions">
        <button id="dialogCancelButton" type="button" class="ghost" data-i18n="dialog.buttons.cancel">Cancel</button>
        <button id="dialogConfirmButton" type="button" class="primary-button" data-i18n="dialog.buttons.ok">OK</button>
      </div>
    </div>
  </div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
